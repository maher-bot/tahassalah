<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>مراجعة التجار · تحصّله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><div class="in">
  <a class="mark" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z" fill="var(--pin)"/><circle cx="12" cy="9" r="2.6" fill="var(--surface)"/></svg>تحصّله · الإدارة</a>
  <div class="sp"><a class="btn ghost sm" href="field.html">📍 الفريق الميداني</a><span class="who" id="who"></span><button class="btn ghost sm" id="logout" hidden>خروج</button></div>
</div></header>

<main>
  <p id="v-loading" class="hint" style="text-align:center;padding:40px">جارِ التحميل…</p>

  <section id="v-login" class="narrow" hidden>
    <form class="card stack" id="f-login" novalidate>
      <h1 style="font-size:1.5rem">دخول الإدارة</h1>
      <label>الإيميل<input type="email" name="email" dir="ltr" autocomplete="email" required></label>
      <label>كلمة المرور<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="err" role="alert"></p>
      <button class="btn primary" type="submit">دخول</button>
    </form>
  </section>

  <section id="v-denied" class="narrow" hidden>
    <div class="card status"><h2>هذا الحساب ليس مشرفًا</h2><p>أضف الحساب لجدول المشرفين من Supabase (راجع ملف «اقرأني»)، ثم حدّث الصفحة.</p></div>
  </section>

  <section id="v-list" hidden>
    <div class="toolbar">
      <h1 style="font-size:1.6rem;margin-inline-end:auto">طلبات التجار</h1>
      <input type="search" id="q" placeholder="ابحث بالاسم أو السجل أو الجوال" style="flex:0 1 300px">
      <button class="btn ghost sm" id="refresh">تحديث</button>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-s="pending" aria-selected="true">قيد المراجعة <span class="count num" data-c="pending">0</span></button>
      <button role="tab" data-s="approved" aria-selected="false">مفعّل <span class="count num" data-c="approved">0</span></button>
      <button role="tab" data-s="rejected" aria-selected="false">يحتاج تعديل <span class="count num" data-c="rejected">0</span></button>
      <button role="tab" data-s="suspended" aria-selected="false">موقوف <span class="count num" data-c="suspended">0</span></button>
      <button role="tab" data-s="launch" aria-selected="false">🚀 الإطلاق</button>
    </div>
    <div class="mlist" id="mlist"></div>
  </section>
</main>

<dialog id="dlg-note">
  <form method="dialog" id="f-note" novalidate>
    <h2 style="font-size:1.2rem" id="note-title">سبب الرفض</h2>
    <p class="hint" id="note-hint">يوصل للتاجر في الإيميل ويظهر له في صفحته، فاكتبه واضحًا: وش المطلوب يعدّل.</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px" id="presets"></div>
    <textarea name="note" rows="4" required></textarea>
    <p class="err" role="alert"></p>
    <div class="foot">
      <button class="btn ghost" type="button" id="note-cancel">إلغاء</button>
      <button class="btn danger" type="submit" id="note-ok">إرسال</button>
    </div>
  </form>
</dialog>

<script type="module" src="admin.js"></script>
</body>
</html>
